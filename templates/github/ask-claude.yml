# Copy to .github/workflows/ask-claude.yml on the default branch. Settings: see
# https://github.com/amyteq/dev-lite/blob/v0/scripts/github-agent/README.md
name: Ask Claude
on:
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  issues: { types: [opened, edited] }
  discussion: { types: [created, edited] }
  discussion_comment: { types: [created] }
  workflow_dispatch:
    inputs:
      surface: { type: choice, options: [issue, pull_request, discussion], default: issue }
      number: { type: string, required: true }
      request: { type: string, required: true }
permissions: { contents: write, pull-requests: write, issues: write, discussions: write }
concurrency:
  group: ask-claude-${{ github.event.issue.number || github.event.pull_request.number || github.event.discussion.number || inputs.number }}
jobs:
  claude:
    if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event), '@claude')
    uses: amyteq/dev-lite/.github/workflows/ask-agent.yml@v0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      agent: claude
      # base_branch: develop
      # protected_branches: develop,lovable
      # project_rules_file: docs/agent-rules.md
